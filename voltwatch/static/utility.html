      <main id="main" class="workspace">

          <h1>Simulation Controls</h1>
          <div class="header-actions">
            <span id="utility-status" class="pill unknown">Connecting</span
            ><button id="theme-toggle" class="theme-toggle" aria-label="Switch color theme"></button><!-- Glass surfaces are always on for now.

          </div>
        </header>
        <div id="utility-notice" role="status"></div>
        <div class="utility-layout">
          <aside class="utility-list" data-glass>
            <div class="fleet-head">
              <div>
                <h2>Vehicles</h2>
                <p>Select a vehicle to configure</p>
              </div>
              <span id="utility-count" class="count">—</span>
            </div>
            <div id="utility-buses">
              <div class="empty">Loading vehicles…</div>
            </div>
          </aside>
          <section
            id="utility-grid"
            class="utility-grid"
            tabindex="-1"
            aria-label="Selected vehicle controls"
          >
            <div class="empty">Loading controls…</div>
          </section>
        </div>
      </main>
    </div>
